<!doctype html>
<html>
  <body style="margin: 0; background: #000">
    <div id="root"></div>
    <pre id="err" style="color: #f66; font: 12px monospace; padding: 8px"></pre>
    <script type="module">
      try {
        const React = (await import('react')).default;
        const { createRoot } = await import('react-dom/client');
        const { LiveCapture } = await import('/src/components/capture/LiveCapture.tsx');

        // Soxta kamera oqimi: kanvasga "ko'cha" manzarasi chizib, undan stream olamiz
        const cv = document.createElement('canvas');
        cv.width = 1280;
        cv.height = 720;
        const g = cv.getContext('2d');
        const draw = () => {
          const sky = g.createLinearGradient(0, 0, 0, 720);
          sky.addColorStop(0, '#5b7fa6');
          sky.addColorStop(1, '#c9d4de');
          g.fillStyle = sky;
          g.fillRect(0, 0, 1280, 720);
          g.fillStyle = '#3a3f45';
          g.fillRect(0, 520, 1280, 200);
          g.fillStyle = '#d8dde3';
          g.fillRect(430, 330, 430, 150);
          g.fillStyle = '#1b1e22';
          g.beginPath();
          g.arc(520, 480, 42, 0, 7);
          g.arc(770, 480, 42, 0, 7);
          g.fill();
          requestAnimationFrame(draw);
        };
        draw();
        const stream = cv.captureStream(30);

        createRoot(document.getElementById('root')).render(
          React.createElement(LiveCapture, {
            carId: '00000000-0000-0000-0000-000000000000',
            stream,
            detectorRef: { current: null },
            detectorReady: false,
            sensorGranted: false,
            demo: new URLSearchParams(location.search).get('demo') === '1',
            onClose: () => {},
            onFinish: () => {},
          })
        );
      } catch (e) {
        document.getElementById('err').textContent = 'XATO: ' + (e && e.stack ? e.stack : e);
      }
    </script>
  </body>
</html>
